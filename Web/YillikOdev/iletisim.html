<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>İletişim | Mert Can Yiğit</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <header>
      <h1>Mert Can Yiğit</h1>
      <p class="tagline">Full Stack Developer Adayı</p>
    </header>

    <ul id="top-menu">
      <li><a href="index.html">Anasayfa</a></li>
      <li><a href="projeler.html">Projeler</a></li>
      <li><a href="hakkimda.html">Hakkımda</a></li>
      <li><a href="iletisim.html" class="active">İletişim</a></li>
    </ul>

    <div class="page-content">
      <h2>İletişim</h2>
      <hr />
      <p class="mb-4">
        Benimle iletişime geçmek için aşağıdaki formu doldurabilirsiniz.
      </p>

      <div class="contact-form">
        <label for="isim">Ad Soyad</label>
        <input
          type="text"
          id="isim"
          class="form-control"
          placeholder="Adınızı yazın"
        />

        <label for="email">E-posta</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="ornek@email.com"
        />

        <label for="mesaj">Mesaj</label>
        <textarea
          id="mesaj"
          class="form-control"
          rows="5"
          placeholder="Mesajınızı yazın"
        ></textarea>

        <button type="button" id="gonder" class="btn btn-send">Gönder</button>
      </div>
    </div>

    <footer>
      <p>© 2026 Mert Can Yiğit. Tüm hakları saklıdır.</p>
    </footer>

    <script src="js/form.js"></script>
  </body>
</html>
